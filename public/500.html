<!doctype html>
<html lang="en">
  <head>
    <title>Something went wrong - Tallyloot</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body {
        background: #121212;
        color: #f5f5f5;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100vh;
        place-items: center;
      }
      main {
        display: grid;
        gap: 1.5rem;
        padding: 2rem;
        place-items: center;
        text-align: center;
        max-width: 480px;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: #4ae087;
      }
      .error-code {
        font-size: 5rem;
        font-weight: 800;
        color: #2a2a2a;
        line-height: 1;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: #a0a0a0;
        font-size: 0.9rem;
      }
      a {
        color: #4ae087;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
      .actions { margin-top: 0.5rem; }
      .actions a {
        display: inline-block;
        background: #4ae087;
        color: #121212;
        padding: 0.6rem 1.5rem;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .actions a:hover {
        background: #3bc472;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Tallyloot</div>
      <div class="error-code">500</div>
      <h1>Something went wrong</h1>
      <p>We've been notified and are looking into it. If this keeps happening, please contact support with the reference below.</p>
      <div class="actions">
        <a href="/">Back to Dashboard</a>
      </div>
    </main>
  </body>
</html>
